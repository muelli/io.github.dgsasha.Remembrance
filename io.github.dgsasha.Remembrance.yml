app-id: io.github.dgsasha.Remembrance
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: remembrance

finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.secrets
  - --socket=pulseaudio

modules:
  - shared-modules/intltool/intltool-0.51.json
  - shared-modules/libcanberra/libcanberra.json
  - python3-modules.json

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dbackends=gtk4
    sources:
      - type: archive
        url: https://github.com/flatpak/libportal/archive/0.9.1.tar.gz
        sha256: ea422b789ae487e04194d387bea031fd7485bf88a18aef8c767f7d1c29496a4e
        x-checker-data:
          type: anitya
          project-id: 230124
          stable-only: true
          url-template: https://github.com/flatpak/libportal/archive/$version.tar.gz

  - name: gsound
    buildsystem: meson
    config-opts:
      - -Denable_vala=false
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/gsound/-/archive/1.0.3/gsound-1.0.3.tar.gz
        sha256: ebee33c77f43bcae87406c20e051acaff08e86f8960c35b92911e243fddc7a0b

  - name: sound-theme-freedesktop
    sources:
      - type: archive
        url: http://people.freedesktop.org/~mccann/dist/sound-theme-freedesktop-0.8.tar.bz2
        sha256: cb518b20eef05ec2e82dda1fa89a292c1760dc023aba91b8aa69bafac85e8a14

  - name: remembrance
    builddir: true
    buildsystem: meson
    config-opts:
      - -Denable-portals=true
    sources:
      - type: archive
        url: https://github.com/dgsasha/remembrance/archive/refs/tags/v4.0.tar.gz
        sha256: b3410b1718a8a08d7adb962b66c74ef298d0ee1bcc87c4109701fb2bfcabb772

